<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Brian Kipkemboi Koech</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Outfit', sans-serif;
    background: #FAFBFD;
    color: #111827;
    text-align: center;
    padding: 2rem;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0B0F1A; color: #F1F5F9; }
    .btn { border-color: rgba(255,255,255,0.1); color: #F1F5F9; }
    .btn:hover { background: rgba(96,165,250,0.1); border-color: #60A5FA; color: #60A5FA; }
  }
  .code { font-family: 'IBM Plex Mono', monospace; font-size: 5rem; font-weight: 800; letter-spacing: -0.03em; background: linear-gradient(135deg, #1E40AF, #3B82F6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 1rem 0 0.5rem; }
  p { color: #6B7280; font-size: 1rem; margin-bottom: 2rem; }
  .btn { display: inline-block; font-family: 'Outfit', sans-serif; font-size: 0.85rem; font-weight: 600; padding: 0.75rem 1.6rem; border: 1.5px solid rgba(0,0,0,0.1); border-radius: 8px; text-decoration: none; color: #111827; transition: all 0.25s; }
  .btn:hover { border-color: #1E40AF; color: #1E40AF; background: rgba(30,64,175,0.06); }
</style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist. Let's get you back on track.</p>
    <a href="/" class="btn">← Back to Portfolio</a>
  </div>
</body>
</html>
